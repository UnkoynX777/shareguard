name: Feature request
description: A change to ShareGuard.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: You can write this request in English or Brazilian Portuguese.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: When would you use this during a screen share?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
  - type: textarea
    id: context
    attributes:
      label: Additional context

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'UnkoynX777/shareguard' && github.ref_type == 'tag'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check version files
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }
          if ($tag -notmatch '^(?<ver>[0-9]+\.[0-9]+\.[0-9]+)(?:-.+)?$') {
            throw "Tag must look like v0.3.0 or v0.3.0-beta.1"
          }
          ./scripts/check-version.ps1 -Expected $Matches.ver
          if ($tag -ne $Matches.ver) {
            "prerelease=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "prerelease=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Typecheck, test, and build the extension
        working-directory: extension
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run lint:firefox

      - name: Package Chromium extension
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Validate packages
        shell: pwsh
        run: ./scripts/validate-packages.ps1

      - name: Sign Firefox extension
        shell: pwsh
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: ./scripts/sign-firefox.ps1

      - name: Build native helper
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $version = "6.7.3"
          $expected = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-$version.exe" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup hash mismatch: $actual" }
          $process = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installer exited $($process.ExitCode)" }

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found." }
          & $iscc .\installer\shareguard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect release files
        shell: pwsh
        run: |
          $version = "$(./scripts/check-version.ps1)".Trim()
          $out = Join-Path $env:RUNNER_TEMP "shareguard-publish"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $setup = ".\installer\Output\ShareGuard-Setup-v$version-x64.exe"
          $chromium = ".\release\ShareGuard-Chromium-v$version.zip"
          if (-not (Test-Path $setup)) { throw "Installer was not produced." }
          if (-not (Test-Path $chromium)) { throw "Chromium package was not produced." }
          Copy-Item $setup $out
          Copy-Item $chromium $out
          $firefox = ".\release\ShareGuard-Firefox-v$version.xpi"
          $firefoxNote = "Firefox: this release does not include a signed Firefox extension. The user Firefox package is unavailable until Mozilla unlisted signing succeeds."
          if (Test-Path $firefox) {
            Copy-Item $firefox $out
            $firefoxNote = "Firefox: download ``ShareGuard-Firefox-v$version.xpi`` and install it from a file. See the installation guide."
          }
          $sums = foreach ($file in Get-ChildItem $out -File) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -Encoding ascii -Path (Join-Path $out "SHA256SUMS.txt") -Value $sums
          $guide = "https://github.com/UnkoynX777/shareguard/blob/${{ github.sha }}/docs/INSTALLATION.md"
          $lines = @(
            "ShareGuard ${{ github.ref_name }}"
            ""
            "## Installation"
            ""
            "1. Download ``ShareGuard-Setup-v$version-x64.exe``."
            "2. Install ShareGuard."
            "3. Add the browser extension."
            ""
            "Chrome and Edge load the folder the installer copies to ``%LOCALAPPDATA%\ShareGuard\Extension\Chromium``. Developer mode and Load unpacked are required because the extension is distributed from GitHub. ``ShareGuard-Chromium-v$version.zip`` is the same extension if you want a separate copy."
            ""
            $firefoxNote
            ""
            "Guide: $guide"
            ""
            "Official files come only from this GitHub Release. Compare ``SHA256SUMS.txt`` if you want to check a download. The installer is not code-signed, so Windows SmartScreen may warn before you run it."
          )
          Set-Content -Encoding utf8NoBOM -Path (Join-Path $out "notes.md") -Value $lines
          "out=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem $env:out -File | Where-Object { $_.Name -ne "notes.md" } | ForEach-Object { $_.FullName })
          if (-not ($files | Where-Object { $_ -like "*ShareGuard-Setup-*" })) { throw "Release is missing the installer." }
          if (-not ($files | Where-Object { $_ -like "*ShareGuard-Chromium-*" })) { throw "Release is missing the Chromium package." }
          $prerelease = @()
          if ($env:prerelease -eq "true") { $prerelease = @("--prerelease") }
          gh release create "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --title "ShareGuard ${{ github.ref_name }}" `
            --notes-file "$env:out\notes.md" `
            @prerelease `
            @files
